version: '3.8'

# Production Docker Compose for AI Workflow Engine
# This configuration provides a complete production deployment with:
# - Load balancing and SSL termination
# - Database with persistence and backups
# - Monitoring and observability stack
# - High availability and scalability

services:
  # AI Workflow Engine Application
  workflow-engine:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
    container_name: ai-workflow-engine-app
    restart: unless-stopped
    environment:
      # Application settings
      APP_ENVIRONMENT: production
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_WORKERS: 4
      
      # Database configuration
      DB_DATABASE_URL: postgresql+asyncpg://workflow_user:${POSTGRES_PASSWORD}@postgres:5432/workflow_engine
      DB_POOL_SIZE: 20
      DB_MAX_OVERFLOW: 30
      DB_POOL_TIMEOUT: 30
      DB_POOL_RECYCLE: 3600
      DB_AUTO_MIGRATE: "true"
      
      # Redis configuration
      REDIS_REDIS_URL: redis://redis:6379/0
      REDIS_CONNECTION_POOL_SIZE: 20
      REDIS_DEFAULT_TTL: 3600
      
      # Monitoring configuration
      MONITORING_ENABLE_METRICS: "true"
      MONITORING_METRICS_PORT: 8001
      MONITORING_LOG_LEVEL: INFO
      MONITORING_LOG_FORMAT: json
      MONITORING_HEALTH_CHECK_INTERVAL: 30
      
      # Security configuration
      SECURITY_SECRET_KEY: ${SECRET_KEY}
      SECURITY_CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
      SECURITY_RATE_LIMIT_ENABLED: "true"
      SECURITY_RATE_LIMIT_REQUESTS: 1000
      SECURITY_MAX_REQUEST_SIZE: 10485760  # 10MB
      
      # Execution configuration
      EXECUTION_MAX_PARALLEL_WORKFLOWS: 100
      EXECUTION_MAX_PARALLEL_NODES: 10
      EXECUTION_DEFAULT_WORKFLOW_TIMEOUT: 3600
      EXECUTION_DEFAULT_NODE_TIMEOUT: 300
      EXECUTION_DEFAULT_MAX_RETRIES: 3
      EXECUTION_MAX_WORKFLOW_SIZE_MB: 10
    ports:
      - "8000:8000"  # Main application
      - "8001:8001"  # Metrics endpoint
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - workflow-network
    volumes:
      - workflow-logs:/app/logs
      - workflow-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ai-workflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workflow_engine
      POSTGRES_USER: workflow_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backups:/backups
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - workflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_user -d workflow_engine"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ai-workflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - workflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: redis-server /usr/local/etc/redis/redis.conf
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ai-workflow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx-sites:/etc/nginx/conf.d:ro
      - nginx-logs:/var/log/nginx
      - ssl-certs:/etc/ssl/certs:ro
    depends_on:
      - workflow-engine
    networks:
      - workflow-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-workflow-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus-rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - workflow-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: ai-workflow-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - workflow-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # PostgreSQL Backup Service
  postgres-backup:
    image: postgres:15-alpine
    container_name: ai-workflow-postgres-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_DB: workflow_engine
      POSTGRES_USER: workflow_user
      BACKUP_SCHEDULE: "0 2 * * *"  # Daily at 2 AM
      BACKUP_RETENTION_DAYS: 30
    volumes:
      - postgres-backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - workflow-network
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
      apk add --no-cache dcron &&
      echo '$${BACKUP_SCHEDULE} /backup.sh' | crontab - &&
      crond -f -l 2
      "
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # Log Aggregator (Optional)
  fluentd:
    image: fluent/fluentd:latest
    container_name: ai-workflow-fluentd
    restart: unless-stopped
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./config/fluentd.conf:/fluentd/etc/fluent.conf:ro
      - fluentd-logs:/fluentd/log
    networks:
      - workflow-network
    depends_on:
      - workflow-engine
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

# Production Networks
networks:
  workflow-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Persistent Volumes
volumes:
  # Database storage
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/workflow-engine/data/postgres
  
  postgres-backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/workflow-engine/backups/postgres
  
  # Cache storage
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/workflow-engine/data/redis
  
  # Application storage
  workflow-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/workflow-engine/logs
  
  workflow-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/workflow-engine/data/app
  
  # Monitoring storage
  prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/workflow-engine/data/prometheus
  
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/workflow-engine/data/grafana
  
  # Web server storage
  nginx-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/workflow-engine/logs/nginx
  
  ssl-certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/workflow-engine/certs
  
  # Log aggregation
  fluentd-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/workflow-engine/logs/fluentd

# Production secrets should be managed externally
# Example .env file structure:
# POSTGRES_PASSWORD=your_secure_postgres_password
# SECRET_KEY=your_secure_secret_key_32_chars_minimum
# GRAFANA_PASSWORD=your_secure_grafana_password
# GRAFANA_SECRET_KEY=your_secure_grafana_secret_key
# CORS_ORIGINS=["https://yourdomain.com","https://app.yourdomain.com"]