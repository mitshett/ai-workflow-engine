[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ai-workflow-engine"
version = "0.1.0"
description = "Next-generation AI-native Workflow Engine capable of orchestrating Agents, Tools, and MCP Servers"
authors = ["AI Workflow Engine Team"]
readme = "README.md"
packages = [{include = "workflow_engine", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
sqlalchemy = "^2.0"
asyncpg = "^0.29"
pydantic = "^2.0"
structlog = "^23.0"
mcp = {extras = ["cli"], version = "^1.17.0"}
anthropic = "^0.30.0"
openai = "^1.0"
asteval = "^0.9.31"
fastapi = "^0.115"
uvicorn = "^0.31.1"
aiohttp = "^3.9"
click = "^8.1"
pyyaml = "^6.0"
jinja2 = "^3.1"
alembic = "^1.13"
python-dotenv = "^1.0.0"
requests = "^2.31"

# LangChain Dependencies with MCP Integration
langchain-mcp-adapters = "^0.1.12"
langchain-openai = "^0.2.14"
langchain-core = "^0.3.36"
langgraph = "^0.2.49"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
pytest-cov = "^4.1"
black = "^23.9"
isort = "^5.12"
flake8 = "^6.1"
mypy = "^1.6"
pre-commit = "^3.5"

[tool.poetry.scripts]
workflow-engine = "workflow_engine.cli.main:main"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["workflow_engine"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=workflow_engine --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]