services:
  # AI Workflow Engine Application
  workflow-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-workflow-engine-dev
    restart: unless-stopped
    environment:
      # Application settings
      APP_ENVIRONMENT: development
      APP_DEBUG: "true"
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      
    ports:
      - "8003:8000"
    networks:
      - workflow-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount source code for development (hot reload)
      - ./src:/app/src:ro
      # Mount .env file if it exists (optional)
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  workflow-network:
    driver: bridge
    name: ai-workflow-network-dev