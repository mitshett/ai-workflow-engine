services:
  # =============================================================================
  # AI Workflow Engine (Backend API)
  # =============================================================================
  workflow-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-workflow-engine
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: development
      APP_DEBUG: "true"
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "8003:8000"
    volumes:
      - ./src:/app/src:ro
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - workflow-network

  # =============================================================================
  # Cisco MCP Server (Cisco API Tools)
  # =============================================================================
  cisco-mcp-server:
    build:
      context: ./cisco-mcp-server
      dockerfile: Dockerfile
    container_name: cisco-mcp-server
    restart: unless-stopped
    env_file:
      - ./cisco-mcp-server/.env
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - workflow-network

  # =============================================================================
  # Jira MCP Server (Jira/Atlassian Tools)
  # =============================================================================
  jira-mcp-server:
    image: ghcr.io/sooperset/mcp-atlassian:latest
    container_name: jira-mcp-server
    restart: unless-stopped
    environment:
      - JIRA_URL=${JIRA_URL}
      - JIRA_USERNAME=${JIRA_USERNAME}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - MCP_TRANSPORT=streamable-http
      - MCP_PORT=9080
    command: ["--transport", "streamable-http", "--port", "9080", "--path", "/mcp"]
    ports:
      - "8182:9080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - workflow-network

  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: ai-workflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_workflow_engine}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflow_password}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_workflow_engine}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - workflow-network

  # =============================================================================
  # pgAdmin (Database Management UI) — optional
  # Start with: docker compose --profile admin up
  # =============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ai-workflow-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@workflow.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_password}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workflow-network
    profiles:
      - admin

  # =============================================================================
  # Redis (Cache/Queue) — optional
  # Start with: docker compose --profile cache up
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: ai-workflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - workflow-network
    profiles:
      - cache

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local

networks:
  workflow-network:
    driver: bridge
    name: ai-workflow-network
